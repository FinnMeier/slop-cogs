name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Hinweis: Red-Bot benötigt für neuere Versionen meist Python 3.11 ODER 3.12.
        # Falls es hier zu Installationsfehlern kommt, passe die Versionen an.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Hier installieren wir die Bibliotheken, die dein Code importiert:
        pip install red-discordbot pytest pylint
        
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
