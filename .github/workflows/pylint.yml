name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Hier erzwingen wir Python 3.11, damit Red-DiscordBot installierbar ist
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # wheel hilft, Abhängigkeiten sauber zu bauen
        pip install wheel
        pip install red-discordbot pytest pylint
        
    - name: Analysing the code with pylint
      run: |
        # || true sorgt dafür, dass kosmetische Warnungen deine Pipeline nicht blockieren
        pylint $(git ls-files '*.py') || true
